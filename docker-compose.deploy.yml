services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    ports:
      - "${PUBLIC_BIND_HOST:-0.0.0.0}:${PUBLIC_PORT:-10001}:10001"
    volumes:
      - ${CADDY_CONFIG_PATH:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app-server:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - --checkpoint_timeout=15min
      - --checkpoint_completion_target=0.9
      - --max_wal_size=2GB
      - --min_wal_size=256MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paper_trading}
      POSTGRES_USER: ${POSTGRES_USER:-paper_trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paper_trading} -d ${POSTGRES_DB:-paper_trading}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  matching-service:
    restart: unless-stopped
    image: ${MATCHING_SERVICE_IMAGE:-p-t-matching-service:latest}
    build:
      context: .
      dockerfile: Dockerfile.server
      target: matching-service
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paper_trading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paper_trading}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8788"
    volumes:
      - logs:/app/data/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  app-server:
    restart: unless-stopped
    image: ${APP_SERVER_IMAGE:-p-t-app-server:latest}
    build:
      context: .
      dockerfile: Dockerfile.server
      target: app-server
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paper_trading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paper_trading}
      REDIS_URL: redis://redis:6379
      MATCHING_SERVICE_URL: http://matching-service:8788
      EMBEDDED_MATCHING_SERVICE: "false"
      NODE_ENV: production
      SERVER_REQUIRE_MIGRATIONS: "true"
      SERVER_ALLOW_DEV_SCHEMA_BOOTSTRAP: "false"
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      matching-service:
        condition: service_healthy
    expose:
      - "8787"
    volumes:
      - logs:/app/data/logs
      - backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app-server:
        condition: service_healthy
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    expose:
      - "9090"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles:
      - monitoring
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"

  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - monitoring
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    expose:
      - "3000"

volumes:
  pgdata:
  redisdata:
  logs:
  backups:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
